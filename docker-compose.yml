services:
  # ============================================================================
  # 1. Backend Application (Laravel PHP 8.3 FPM)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hitshare_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - backend_storage:/var/www/backend/storage
      - backend_uploads:/var/www/backend/public/uploads
      - backend_downloads:/var/www/backend/public/downloads
      - ./.env:/var/www/backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hitshare_network

  # ============================================================================
  # 2. Scheduler Worker (Auto-expire Pending Orders, Cleanups, etc.)
  # ============================================================================
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hitshare_scheduler
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "/var/www/backend/artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    volumes:
      - backend_storage:/var/www/backend/storage
      - ./.env:/var/www/backend/.env
    depends_on:
      - app
      - db
    networks:
      - hitshare_network

  # ============================================================================
  # 3. Web Server & Frontend (Nginx Alpine + Built React SPA)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: hitshare_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - backend_storage:/var/www/backend/storage:ro
      - backend_uploads:/var/www/backend/public/uploads:ro
      - backend_downloads:/var/www/backend/public/downloads:ro
      - ./docker/nginx/hitshare.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hitshare_network

  # ============================================================================
  # 4. Database (MySQL 8.0)
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: hitshare_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=150
      - --innodb_buffer_pool_size=256M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hitshare}
      MYSQL_USER: ${DB_USERNAME:-hitshare_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hitshare_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hitshare_root_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-hitshare_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - hitshare_network

  # ============================================================================
  # 5. In-Memory Cache & Session Store (Redis)
  # ============================================================================
  redis:
    image: redis:alpine
    container_name: hitshare_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - hitshare_network

# ==============================================================================
# Persistent Volumes & Private Network
# ==============================================================================
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  backend_uploads:
    driver: local
  backend_downloads:
    driver: local

networks:
  hitshare_network:
    driver: bridge
